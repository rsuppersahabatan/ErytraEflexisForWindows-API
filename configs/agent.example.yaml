# Konfigurasi agent Erytra Eflexis.
# Salin menjadi configs/agent.yaml lalu sesuaikan dengan lapangan.
# Semua nilai yang berubah di lapangan ada di sini — tidak perlu rebuild.

machine:
  serial: "059-000-1027"        # dari machine.config lama
  name: "ANGTHONG_IoT-1"

timezone: Asia/Jakarta

inbox:
  # Folder bersama Diana Server (LIS Common Folder). Bisa path lokal atau share.
  # Contoh share: "\\\\server\\lis-share"
  dir: "C:\\Erytra\\share"
  # Nama tetap dari mesin. JANGAN pakai pola *.dat:
  # Diana Server juga menulis TX_TMP.dat (setengah transaksi) di folder yang sama.
  filename: "OUT.dat"
  # Polling, bukan fsnotify: event filesystem tidak andal di share jaringan.
  poll_interval: 2s
  # "rename" = satu operasi atomik (klaim + folder bersih sekaligus).
  # "copy_verify_delete" = cadangan bila ACL share menolak rename.
  claim: rename
  # Gate kestabilan: lama berkas harus diam (ukuran+mtime tidak berubah)
  # sebelum diklaim. 0 = langsung klaim, dan itu yang benar untuk alur Diana
  # karena TX_TMP.dat di-rename secara atomik. Isi mis. 2s hanya bila folder
  # bersama diisi dengan cara lain (operator menyalin berkas manual).
  stability: 0
  # Nilai Timeout di Diana Server. Hanya dipakai untuk alarm kesehatan,
  # bukan untuk menunda penghapusan. Juga menjadi batas berkas kosong boleh
  # dibiarkan di folder bersama sebelum dipindahkan ke folder error.
  delete_deadline: 30s

# LIS Encoding di Diana Server: utf-8 (default) atau windows-1252 (ANSI).
encoding: utf-8

spool:
  dir: "C:\\Erytra\\spool"
  archive_dir: "C:\\Erytra\\archive"
  error_dir: "C:\\Erytra\\error"
  db_path: "C:\\Erytra\\agent.db"

prima:
  url: "https://prima.example/api/lab/result"
  method: POST
  auth_header: "token"          # sesuaikan: token | Authorization
  token_env: PRIMA_TOKEN        # token dibaca dari environment, bukan dari berkas ini
  timeout: 10s
  idempotency_header: "Idempotency-Key"
  per_result: true              # satu POST per hasil
  retry:
    max_attempts: 8             # di atas ini tetap diulang, tapi ditandai "stuck" di /healthz
    backoff: "1s,5s,30s,2m,5m"
    retry_on_status: [429, 500, 502, 503, 504]
    treat_409_as_success: true  # 409 = sudah ada di Prima, anggap sukses

# Arti komponen hasil per template .pln (Configuration Guide hal. 115-118).
# Tanpa nama, komponen hanya diberi nama c0, c1, ... — payload tetap lengkap.
# WAJIB disesuaikan dengan template yang benar-benar dipakai lab:
# nama field di sini harus diambil dari Listas.exe → Templates, bukan ditebak.
templates:
  # Template generik pada berkas contoh (9 field, 8 komponen).
  "Erytra.pln":
    components: []
    interpretation_index: 6
  # 11 komponen: A.GD, B.GD, AB.GD, D.RH, D'.RH, CTL.HM, A1.GI, B.GI, Dir Gr, Rh, Rev Gr
  "ABO2D.pln":
    components: [A.GD, B.GD, AB.GD, D.RH, "D'.RH", CTL.HM, A1.GI, B.GI, "Dir Gr", Rh, "Rev Gr"]
    interpretation_index: 8
  "3 Screen(AHG).pln":
    components: [I, II, III, "IA C", IA]
    interpretation_index: 3

api:
  addr: "127.0.0.1:8099"

log:
  level: info
  format: json
  file: "C:\\Erytra\\logs\\agent.log"
